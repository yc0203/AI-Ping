<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>标记文字预览</title><style>html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
.ai-mode-hint { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); padding: 10px 18px; max-width: 85%; border: 1px solid #c8aa6e; border-radius: 6px; background: #11191ff2; color: #f2e6c9; font: 14px/1.6 "Microsoft YaHei", "Segoe UI", sans-serif; text-align: center; pointer-events: none; }
#pings, #emotes, #toasts { position: fixed; inset: 0; pointer-events: none; }

/* ---------- wheel ---------- */
#wheel, #emoteWheel {
  position: absolute; left: 0; top: 0; width: 600px; height: 600px; margin: -300px 0 0 -300px;
  pointer-events: none; opacity: 0; transform: scale(.85); transition: opacity .12s ease-out, transform .12s ease-out;
}
#wheel.open, #emoteWheel.open { opacity: 1; transform: scale(1); }
#wheel .wedge, #emoteWheel .wedge { transition: fill-opacity .08s; }
#wheel .icon, #emoteWheel .icon {
  transition: filter .1s, transform .1s; transform-box: fill-box; transform-origin: center;
  filter: grayscale(1) sepia(.75) saturate(1.3) brightness(1.15);
}
#wheel .icon.hot, #emoteWheel .icon.hot { filter: none; transform: scale(1.18); }
#wheel .centerTxt, #emoteWheel .centerTxt { font: 600 15px "Segoe UI", sans-serif; letter-spacing: 1px; fill: #1fa9e0; }
#wheel .backTxt, #emoteWheel .backTxt { font: 600 9px "Segoe UI", sans-serif; fill: #6c7a7c; letter-spacing: .5px; }
#wheel .slotLabel { font: 600 12px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #eee6d3; stroke: #071018; stroke-width: 3px; paint-order: stroke fill; }
#wheel .actionHint, #emoteWheel .actionHint { font: 12px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #b9cdd0; }
.ping .action-caption { position: absolute; left: 0; top: calc(var(--size) * .30); transform: translateX(-50%); white-space: nowrap; pointer-events: none; color: var(--c); font: 700 20px "Microsoft YaHei", "Segoe UI", sans-serif; text-shadow: 0 1px 2px #000, 0 0 8px var(--c); animation: tagIn .25s ease-out both, life var(--dur) linear forwards; }
.ping .action-caption img { width: calc(var(--size) * 2.32); height: calc(var(--size) * .87); display: block; object-fit: contain; }
/* Emote art is square: draw it round, like the League emote wheel. It keeps its own colours (only ping icons are tinted
   until hovered), so the hot slice shows by its wedge and the larger icon. */
#emoteWheel .icon, #emoteWheel .hub { clip-path: circle(50%); }
#emoteWheel .icon { filter: none; }

/* ---------- pings (sizes scale with --size, timing with --dur) ---------- */
.ping { position: absolute; width: 0; height: 0; pointer-events: none; --size: 110px; --dur: 3.2s; }
.ping .ground {
  position: absolute; left: calc(var(--size) * -0.42); top: calc(var(--size) * 0.2);
  width: calc(var(--size) * 0.84); height: calc(var(--size) * 0.24); border-radius: 50%;
  background: radial-gradient(closest-side, var(--c), transparent); opacity: 0; animation: ground var(--dur) ease-out forwards;
}
.ping .ring {
  position: absolute; left: calc(var(--size) * -0.545); top: calc(var(--size) * -0.545);
  width: calc(var(--size) * 1.09); height: calc(var(--size) * 1.09); box-sizing: border-box; border-radius: 50%;
  border: 3px solid var(--c); box-shadow: 0 0 18px var(--c), inset 0 0 12px var(--c); opacity: 0; animation: ring .65s ease-out forwards;
}
.ping .ring.r2 { animation-delay: .22s; }
.ping .ring.r3 { animation-delay: 1.4s; }
.ping .art {
  position: absolute; left: calc(var(--size) * -0.5); top: calc(var(--size) * -0.73);
  width: var(--size); height: var(--size); animation: life var(--dur) linear forwards;
}
.ping .art img { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 0 10px var(--c)); }
.ping .pop { position: absolute; inset: 0; animation: pop .28s cubic-bezier(.2,1.6,.4,1) both, bob 1.6s ease-in-out .3s infinite; }
.ping .clash { position: absolute; inset: 0; animation: shake .25s linear .22s both, bob 1.6s ease-in-out .5s infinite; }
.ping .a1 { animation: slide1 .22s cubic-bezier(.5,0,.9,.5) both; }
.ping .a2 { animation: slide2 .22s cubic-bezier(.5,0,.9,.5) both; }
.ping .flash {
  position: absolute; left: 25%; top: 25%; width: 50%; height: 50%; border-radius: 50%;
  background: radial-gradient(closest-side, #fff, var(--c) 40%, transparent); opacity: 0; animation: flash .35s ease-out .2s forwards;
}
.ping .tag, .emote .tag {
  position: absolute; left: 0; top: calc(var(--size) * 0.5); transform: translateX(-50%); white-space: nowrap;
  max-width: 220px; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box;
  padding: 1px 7px; border-radius: 4px; background: rgba(8, 12, 16, .62); color: var(--tag);
  font: 600 13px/18px "Segoe UI Variable Text", "Segoe UI", -apple-system, sans-serif; letter-spacing: .2px;
  text-shadow: 0 1px 2px #000; animation: tagIn .25s ease-out both, life var(--dur) linear forwards;
}
@keyframes tagIn { from { transform: translate(-50%, 4px) } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0 } 60% { transform: scale(1.15); opacity: 1 } 100% { transform: scale(1) } }
@keyframes bob { 0%, 100% { translate: 0 0 } 50% { translate: 0 -5px } }
@keyframes ring { 0% { transform: scale(.25); opacity: .95 } 100% { transform: scale(1.35); opacity: 0 } }
@keyframes ground { 0% { opacity: 0 } 10% { opacity: .75 } 85% { opacity: .55 } 100% { opacity: 0 } }
@keyframes life { 0%, 87% { opacity: 1 } 100% { opacity: 0 } }
@keyframes slide1 { 0% { transform: translate(calc(var(--size) * .64), calc(var(--size) * -.64)); opacity: 0 } 100% { transform: none; opacity: 1 } }
@keyframes slide2 { 0% { transform: translate(calc(var(--size) * -.64), calc(var(--size) * -.64)); opacity: 0 } 100% { transform: none; opacity: 1 } }
@keyframes shake { 0%, 100% { transform: none } 25% { transform: translate(-3px, 2px) } 50% { transform: translate(3px, -2px) } 75% { transform: translate(-2px, -1px) } }
@keyframes flash { 0% { opacity: 0; transform: scale(.3) } 30% { opacity: 1 } 100% { opacity: 0; transform: scale(2.2) } }

/* ---------- emotes (--size is the art's width, --dur the 3 s they stay) ---------- */
.emote { position: absolute; width: 0; height: 0; pointer-events: none; --size: 150px; --dur: 3s; }
.emote .tag { top: calc(var(--size) * 0.5 + 8px); }
/* A bundled emote is a baked animation: a 320 px canvas holding 256 px of art, so it is drawn 1.25 times the art's size. */
.emote .sheet {
  position: absolute; left: calc(var(--size) * -0.625); top: calc(var(--size) * -0.625);
  width: calc(var(--size) * 1.25); height: calc(var(--size) * 1.25);
}
/* A custom emote (or the placeholder) gets this envelope instead: pop in, bob, then shrink and fade over the last 0.35 s. */
.emote .fx {
  position: absolute; left: calc(var(--size) * -0.5); top: calc(var(--size) * -0.5); width: var(--size); height: var(--size);
  animation: emoteIn .25s ease-out both, emoteBob 1.4s ease-in-out infinite, emoteOut .35s ease-in calc(var(--dur) - .35s) forwards;
}
.emote .fx img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 8px #fff8); }
.emote .bubble {
  position: absolute; left: 8%; top: 8%; width: 84%; height: 68%; box-sizing: border-box; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: #f4efe2; border: 3px solid #c8aa6e; color: #1f2a30; filter: drop-shadow(0 0 8px #fff8);
  font: 700 calc(var(--size) * .4)/1 "Segoe UI", sans-serif;
}
.emote .bubble::after {
  content: ''; position: absolute; left: 24%; bottom: -7px; width: 14px; height: 14px; box-sizing: border-box;
  background: #f4efe2; border: solid #c8aa6e; border-width: 0 3px 3px 0; transform: rotate(45deg) skew(8deg, 8deg);
}
@keyframes emoteIn { 0% { transform: scale(0) } 60% { transform: scale(1.15) } 100% { transform: scale(1) } }
@keyframes emoteBob { 0%, 100% { translate: 0 0 } 25% { translate: 0 -4px } 75% { translate: 0 4px } }
@keyframes emoteOut { from { transform: scale(1); opacity: 1 } to { transform: scale(.85); opacity: 0 } }

/* ---------- toast ---------- */
.toast {
  position: absolute; right: 24px; bottom: 72px; min-width: 260px; max-width: 420px; display: flex; gap: 12px; align-items: center;
  padding: 12px 16px; border-radius: 8px; color: #fff; background: rgba(32, 32, 32, .92);
  border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 16px 32px rgba(0, 0, 0, .35);
  font: 14px/20px "Segoe UI Variable Text", "Segoe UI", sans-serif; animation: toastIn .3s cubic-bezier(.1,.9,.2,1) both;
}
.toast.out { animation: toastOut .2s ease-in forwards; }
.toast img { width: 28px; height: 28px; }
.toast small { display: block; color: rgba(255, 255, 255, .6); font-size: 12px; }
@media (prefers-color-scheme: light) {
  .toast { color: #1a1a1a; background: rgba(249, 249, 249, .95); border-color: rgba(0, 0, 0, .06); }
  .toast small { color: rgba(0, 0, 0, .55); }
}
@keyframes toastIn { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes toastOut { to { transform: translateY(12px); opacity: 0 } }

html,body{overflow:auto;background:#11191f;color:#e7ddc2;height:auto;font-family:"Microsoft YaHei","Segoe UI",sans-serif}
main{max-width:1400px;margin:48px auto;padding:0 24px}h1{font-size:28px;margin:0 0 12px}p{color:#a7b6be;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:36px}.card{color:inherit;background:#18232b;border:1px solid #77664466;border-radius:12px;padding:20px 4px 16px;cursor:pointer;font:inherit}.card:hover{border-color:#c8aa6e}.card:focus-visible{outline:2px solid #1fa9e0;outline-offset:4px}.card small{color:#a7b6be}.stage{height:260px;position:relative;overflow:hidden}.action-label{position:absolute;left:-128px;top:38px;width:256px;height:96px;animation:labelIn .25s ease-out both,life var(--dur) linear forwards;}.ping .art img{object-fit:contain}
@keyframes labelIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){.ping *{animation:none!important}.ping .ground,.ping .ring{display:none}.ping .pop{opacity:1}}
</style><main><h1>原标记 + 功能文字</h1><p>图标保持原样，文字作为独立透明图片显示在下方。点击任意卡片可重播动画。<br>这是外观预览，尚未接入 AI 功能。</p><div class="grid"><button class="card" data-index="0" aria-label="预览解释这里"><span>解释这里</span><div class="stage"></div><small>点击重播</small></button><button class="card" data-index="1" aria-label="预览给操作方案"><span>给操作方案</span><div class="stage"></div><small>点击重播</small></button><button class="card" data-index="2" aria-label="预览截图翻译"><span>截图翻译</span><div class="stage"></div><small>点击重播</small></button><button class="card" data-index="3" aria-label="预览划词翻译"><span>划词翻译</span><div class="stage"></div><small>点击重播</small></button><button class="card" data-index="4" aria-label="预览仅截图"><span>仅截图</span><div class="stage"></div><small>点击重播</small></button></div></main><script>
const items=[{"id": "explain", "text": "解释这里", "texture": "enemy_missing", "color": "#f2c518", "label": "explain.png"}, {"id": "plan", "text": "给操作方案", "texture": "assist_me", "color": "#56d43c", "label": "plan.png"}, {"id": "translate-screen", "text": "截图翻译", "texture": "need_vision", "color": "#56d43c", "label": "translate-screen.png"}, {"id": "translate-selection", "text": "划词翻译", "texture": "omw", "color": "#2e8bff", "label": "translate-selection.png"}, {"id": "capture", "text": "仅截图", "texture": "pingwheel_basicpingrender", "color": "#2e8bff", "label": "capture.png"}];
function play(card){const item=items[Number(card.dataset.index)],stage=card.querySelector('.stage');stage.replaceChildren();const root=document.createElement('div');root.className='ping';root.style.cssText=`left:50%;top:125px;--size:100px;--dur:3.2s;--c:${item.color}`;for(const cls of ['ground','ring','ring r2','ring r3']){const d=document.createElement('div');d.className=cls;root.append(d)}const art=document.createElement('div');art.className='art';const pop=document.createElement('div');pop.className='pop';const img=document.createElement('img');img.src='../../assets/textures/'+item.texture+'.png';pop.append(img);art.append(pop);root.append(art);const caption=document.createElement('img');caption.className='action-label';caption.src=item.label;caption.alt=item.text;root.append(caption);stage.append(root);setTimeout(()=>root.remove(),3400)}
document.querySelectorAll('.card').forEach(card=>{card.addEventListener('click',()=>play(card));play(card)});
</script></html>
